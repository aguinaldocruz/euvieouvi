[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "euvieouvi"
version = "2.0.0.dev0"
description = "Self-hosted watched movie and series history"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Aguinaldo Cruz" },
]
dependencies = [
  "Flask==3.1.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff>=0.15.21,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=euvieouvi --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["euvieouvi"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
