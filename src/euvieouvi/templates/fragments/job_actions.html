<div class="btn-group" role="group" aria-label="Ações de {{ job.name }}"><a class="btn btn-sm btn-outline-secondary px-2" href="{{ url_for('web.job_history', job_id=job.id) }}" title="Ver execuções" aria-label="Ver execuções"><span aria-hidden="true">☷</span><span class="visually-hidden">Ver execuções</span></a>{% if sync_run %}<button class="btn btn-sm btn-outline-secondary px-2" type="button" title="Acompanhar sincronização" aria-label="Acompanhar sincronização" data-bs-toggle="modal" data-bs-target="#syncFollowModal" hx-get="{{ url_for('web.job_sync_detail_fragment', run_id=sync_run.id) }}" hx-target="#syncFollowContent" hx-swap="innerHTML"><span aria-hidden="true">◉</span><span class="visually-hidden">Acompanhar sincronização</span></button>{% endif %}{% if active and run %}<button class="btn btn-sm btn-outline-warning px-2" type="submit" title="Cancelar execução" aria-label="Cancelar execução" formmethod="post" formaction="{{ url_for('web.job_cancel', run_id=run.id) }}"><span aria-hidden="true">■</span><span class="visually-hidden">Cancelar execução</span></button>{% else %}<button class="btn btn-sm btn-outline-primary px-2" type="submit" title="Executar agora" aria-label="Executar agora" formmethod="post" formaction="{{ url_for('web.job_run', job_id=job.id) }}"><span aria-hidden="true">▶</span><span class="visually-hidden">Executar agora</span></button>{% endif %}</div>
