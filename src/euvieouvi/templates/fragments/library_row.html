<tr id="library-{{ library.id }}"><td><strong>{{ library.name }}</strong></td><td>{{ 'Filmes' if library.media_type.value == 'movie' else 'Séries' }}</td><td>{{ 'Disponível' if library.available else 'Indisponível' }}</td><td>{{ format_datetime(library.last_seen_at) }}</td><td><form method="post" action="{{ url_for('web.library_selection', library_id=library.id) }}" hx-post="{{ url_for('web.library_selection', library_id=library.id) }}" hx-target="#library-{{ library.id }}" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="enabled" value="{{ 'false' if library.enabled else 'true' }}"><button class="btn btn-sm {{ 'btn-success' if library.enabled else 'btn-outline-secondary' }}" {% if not library.available %}disabled{% endif %}>{{ 'Selecionada' if library.enabled else 'Selecionar' }}</button></form></td></tr>
