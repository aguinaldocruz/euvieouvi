{% extends 'base.html' %}{% from 'fragments/media_type.html' import poster_tab %}{% block title %}Catálogo · euvieouvi{% endblock %}{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><h1 class="h2 mb-1">Catálogo</h1><p class="text-secondary mb-0">Filmes, séries e músicas preservados no seu histórico.</p></div></div>
<form class="card card-body mb-4" method="get"><div class="row g-3">
<div class="col-lg-4"><label class="form-label" for="query">Buscar</label><input class="form-control" id="query" name="query" value="{{ query }}" placeholder="Título, artista ou álbum"></div>
<div class="col-sm-6 col-lg-2"><label class="form-label" for="kind">Tipo</label><select class="form-select" id="kind" name="kind"><option value="">Visão principal</option>{% for value,label in [('movie','Filmes'),('show','Séries'),('episode','Episódios'),('artist','Artistas'),('album','Álbuns'),('track','Faixas')] %}<option value="{{ value }}" {% if kind==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="col-sm-6 col-lg-2"><label class="form-label" for="availability">Disponibilidade</label><select class="form-select" id="availability" name="availability"><option value="all">Todos</option><option value="available" {% if availability=='available' %}selected{% endif %}>Em algum servidor</option><option value="unavailable" {% if availability=='unavailable' %}selected{% endif %}>Somente histórico</option></select></div>
<div class="col-sm-6 col-lg-2"><label class="form-label" for="played">Conclusão</label><select class="form-select" id="played" name="played"><option value="all">Todos</option><option value="played" {% if played=='played' %}selected{% endif %}>Assistidos/ouvidos</option><option value="unplayed" {% if played=='unplayed' %}selected{% endif %}>Sem conclusão</option></select></div>
<div class="col-sm-6 col-lg-2"><label class="form-label" for="library">Biblioteca</label><select class="form-select" id="library" name="library"><option value="">Todas</option>{% for value in libraries %}<option value="{{ value.id }}" {% if library==value.id|string %}selected{% endif %}>{{ value.name }}</option>{% endfor %}</select></div>
<div class="col-sm-6 col-lg-2"><label class="form-label" for="genre">Gênero</label><select class="form-select" id="genre" name="genre"><option value="">Todos</option>{% for value in genres %}<option value="{{ value.normalized_name }}" {% if genre==value.normalized_name %}selected{% endif %}>{{ value.name }}</option>{% endfor %}</select></div>
<div class="col-sm-6 col-lg-2"><label class="form-label" for="decade">Década</label><select class="form-select" id="decade" name="decade"><option value="">Todas</option>{% for value in range(2020,1910,-10) %}<option value="{{ value }}" {% if decade==value|string %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
<div class="col-sm-6 col-lg-2"><label class="form-label" for="sort">Ordenar</label><select class="form-select" id="sort" name="sort"><option value="title" {% if sort=='title' %}selected{% endif %}>Título</option><option value="original_title" {% if sort=='original_title' %}selected{% endif %}>Título original</option><option value="year" {% if sort=='year' %}selected{% endif %}>Ano</option><option value="last_played" {% if sort=='last_played' %}selected{% endif %}>Última reprodução</option><option value="first_played" {% if sort=='first_played' %}selected{% endif %}>Primeira reprodução</option><option value="play_count" {% if sort=='play_count' %}selected{% endif %}>Reproduções</option><option value="added" {% if sort=='added' %}selected{% endif %}>Data de inclusão</option><option value="updated" {% if sort=='updated' %}selected{% endif %}>Última atualização</option><option value="removed" {% if sort=='removed' %}selected{% endif %}>Data de remoção</option><option value="duration" {% if sort=='duration' %}selected{% endif %}>Duração</option><option value="rating" {% if sort=='rating' %}selected{% endif %}>Avaliação</option></select></div>
<div class="col-sm-6 col-lg-2"><label class="form-label" for="direction">Direção</label><select class="form-select" id="direction" name="direction"><option value="asc" {% if direction=='asc' %}selected{% endif %}>Crescente</option><option value="desc" {% if direction=='desc' %}selected{% endif %}>Decrescente</option></select></div><div class="col-auto align-self-end"><button class="btn btn-primary">Aplicar</button></div>
</div></form>
<div id="catalog-results" hx-get="{{ catalog_refresh_url }}" hx-trigger="every 5s" hx-swap="innerHTML">{% include 'fragments/catalog_results.html' %}</div>
{% endblock %}
